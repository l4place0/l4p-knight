<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>零号协议 · 完整动作与过程帧</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px;max-width:1240px;margin:auto;background:#0b1016;color:#dce6ef;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}h1{color:#45f0e2;letter-spacing:3px}p{color:#91a2b2;line-height:1.6}button,select,input{accent-color:#45f0e2;background:#182430;color:#eef5fa;border:1px solid #345064;padding:8px;font:inherit}label{margin-right:12px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.stage{display:flex;align-items:center;justify-content:center;gap:40px;min-height:270px;background:radial-gradient(#223644,#0d161e 65%);margin-top:20px;border:1px solid #2b4050}.stage canvas{width:256px;height:256px;image-rendering:pixelated}.info{font-size:18px;color:#45f0e2}h2{font-size:18px;margin-top:24px}.film{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.cell,.actor{background:#151e28;border:1px solid #2b3c4c;text-align:center;padding:8px;color:#9caebd}.film canvas{width:100%;image-rendering:pixelated}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.actor canvas{display:block;width:100%;image-rendering:pixelated}.actor{cursor:pointer;font-size:12px}.actor.selected{border-color:#45f0e2}a{color:#45f0e2}.missing{color:#ffb84d}@media(max-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.stage{gap:5px}.stage canvas{width:160px;height:160px}.film{grid-template-columns:repeat(3,1fr)}}
</style>
<h1>角色动作 / 连续过程帧</h1><p>13 个角色 · 每个角色 7 组动作 × 6 帧，共 546 个绘制帧。下方可以播放、暂停、逐帧拖动，并切换左右朝向。所有帧使用固定尺寸和固定单格坐标。</p>
<div class="controls"><label>角色 <select id="actor"></select></label><label>动作 <select id="action"></select></label><button id="play">暂停</button><label>速度 <select id="speed"><option value="6">6 帧/秒</option><option value="12" selected>12 帧/秒</option><option value="24">24 帧/秒</option></select></label><label><input id="flip" type="checkbox">朝左</label><label>过程帧 <input id="scrub" type="range" min="0" max="5" value="0"></label></div>
<div class="stage"><canvas id="large" width="160" height="160"></canvas><div><div class="info" id="label"></div><p id="description"></p><a id="source" href="vanguard.png">打开完整 42 帧原图</a></div></div>
<h2>完整动作过程 · 从左至右依次播放</h2><div id="film" class="film"></div>
<h2>全部角色 · 点击切换</h2><div id="grid" class="grid"></div>
<p><a href="../../../index.html">进入游戏</a> · <a href="../preview.html">静态素材总览</a> · <a href="prompts.json">完整绘图提示词</a> · <a href="README.md">动作与接入说明</a></p>
<script src="../../../generated/config.js"></script>
<script src="../../../src/core.js"></script><script src="../../../src/animation.js"></script>
<script>
const A=ZERO_ANIMATION,C=ZERO_CORE,sources={};
const labels={idle:'待机',move:'行走 / 翼振 / 悬浮',windup:'蓄力 / 攻击准备',attack:'开火 / 攻击',melee:'挥刃',dash:'冲刺',special:'特殊动作',phase:'阶段变化',hurt:'受击',death:'死亡'};
const names=Object.fromEntries([...Object.entries(C.HEROES),...Object.entries(C.ENEMY_DEFS)].map(([k,v])=>[k,v.name]));
const ids=Object.keys(A.SPECS),actor=document.getElementById('actor'),action=document.getElementById('action'),scrub=document.getElementById('scrub');
let playing=true,frame=0,last=0,loaded=false;
for(const id of ids){const o=document.createElement('option');o.value=id;o.textContent=names[id];actor.append(o);const d=document.createElement('div');d.className='actor';d.dataset.id=id;const cv=document.createElement('canvas');cv.width=cv.height=100;d.append(cv,document.createTextNode(names[id]));d.onclick=()=>{actor.value=id;changeActor()};document.getElementById('grid').append(d)}
for(let i=0;i<6;i++){const d=document.createElement('div');d.className='cell';const cv=document.createElement('canvas');cv.width=cv.height=140;d.append(cv,document.createTextNode('第 '+(i+1)+' 帧'));d.onclick=()=>{playing=false;frame=i;update();document.getElementById('play').textContent='播放'};document.getElementById('film').append(d)}
function changeActor(){const prev=action.value;action.innerHTML='';for(const a of A.SPECS[actor.value].actions){const o=document.createElement('option');o.value=a;o.textContent=labels[a];action.append(o)}if(A.SPECS[actor.value].actions.includes(prev))action.value=prev;else action.value='move';frame=0;last=0;document.getElementById('source').href=actor.value+'.png';update()}
function paint(canvas,id,a,f){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);const im=sources[id],row=A.SPECS[id].actions.indexOf(a);if(!im||row<0)return;const w=im.naturalWidth/6,h=im.naturalHeight/7;ctx.save();ctx.imageSmoothingEnabled=false;if(document.getElementById('flip').checked){ctx.translate(canvas.width,0);ctx.scale(-1,1)}ctx.drawImage(im,f*w,row*h,w,h,0,0,canvas.width,canvas.height);ctx.restore()}
function update(){if(!loaded)return;scrub.value=frame;document.getElementById('label').textContent=names[actor.value]+' / '+labels[action.value]+' / '+(frame+1)+' / 6';document.getElementById('description').textContent=action.value==='death'?'游戏内死亡播完后保留末帧；预览循环方便检查。':'游戏根据动作事件或移动状态播放；预览可逐帧检查。';paint(document.getElementById('large'),actor.value,action.value,frame);document.querySelectorAll('.film canvas').forEach((cv,i)=>paint(cv,actor.value,action.value,i));document.querySelectorAll('.actor').forEach(d=>{d.classList.toggle('selected',d.dataset.id===actor.value);const a=A.SPECS[d.dataset.id].actions.includes(action.value)?action.value:'idle';paint(d.querySelector('canvas'),d.dataset.id,a,frame)})}
actor.onchange=changeActor;action.onchange=()=>{frame=0;last=0;update()};document.getElementById('flip').onchange=update;document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'暂停':'播放'};scrub.oninput=()=>{playing=false;frame=Number(scrub.value);document.getElementById('play').textContent='播放';update()};
Promise.all([A.ready,Promise.all(ids.map(id=>new Promise(resolve=>{const im=new Image();im.onload=()=>{sources[id]=im;resolve(true)};im.onerror=()=>resolve(false);im.src=id+'.png'}))) ]).then(([result])=>{loaded=true;if(!result.every(Boolean)){const p=document.createElement('p');p.className='missing';p.textContent='部分动画尚未加载，请检查服务或图片文件。';document.body.prepend(p)}changeActor();update();document.body.dataset.ready=result.every(Boolean)?'true':'partial'});
function tick(t){if(playing&&t-last>1000/Number(document.getElementById('speed').value)){frame=(frame+1)%6;last=t;update()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
