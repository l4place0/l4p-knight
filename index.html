<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>零号协议 ZERO PROTOCOL</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
:root { --s: 2; --hud-top: 56px; --hud-bottom: 78px; --accent: #45f0e2; --amber: #ffb84d; --red: #ff4757; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(ellipse at 50% 40%, #0d0d12 0%, #060608 70%);
  display: flex; align-items: center; justify-content: center;
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  color: #e8e8ee; user-select: none;
}
#stage {
  position: relative;
  flex-shrink: 0;
  width: calc(480px * var(--s)); height: calc((272px + var(--hud-top) + var(--hud-bottom)) * var(--s));
  background: #080b10;
  box-shadow: 0 0 calc(60px * var(--s)) rgba(69,240,226,0.07), 0 0 calc(8px * var(--s)) #000;
  border: 1px solid #222229;
}
canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #0b0b0f; cursor: none;
}
#game { top: calc(var(--hud-top) * var(--s)); height: calc(272px * var(--s)); }
/* 扫描线 + 暗角 */
#scan { position: absolute; left: 0; right: 0; top: calc(var(--hud-top) * var(--s)); height: calc(272px * var(--s)); pointer-events: none; z-index: 40; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0, rgba(0,0,0,.16) 1px, transparent 1px, transparent 3px); }
#vig { position: absolute; left: 0; right: 0; top: calc(var(--hud-top) * var(--s)); height: calc(272px * var(--s)); pointer-events: none; z-index: 41;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%); }
#fxHurt { position: absolute; left: 0; right: 0; top: calc(var(--hud-top) * var(--s)); height: calc(272px * var(--s)); pointer-events: none; z-index: 42; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(255,71,87,.55) 100%); transition: opacity .08s; }
#fxLow { position: absolute; left: 0; right: 0; top: calc(var(--hud-top) * var(--s)); height: calc(272px * var(--s)); pointer-events: none; z-index: 42; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(255,71,87,.3) 100%); }
#fxLow.on { animation: lowpulse 1s ease-in-out infinite; }
@keyframes lowpulse { 0%,100% { opacity: .15; } 50% { opacity: .55; } }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; z-index: 30;
  font-size: calc(7px * var(--s)); line-height: 1.35; }
.panel { background: rgba(8,8,12,.78); border: 1px solid #26262e; padding: calc(3px * var(--s)) calc(5px * var(--s)); }
#hudTL { position: absolute; top: calc(4px * var(--s)); left: calc(4px * var(--s)); max-width: calc(186px * var(--s)); display: flex; flex-direction: column; gap: calc(2px * var(--s)); }
#hpPips { display: flex; gap: calc(1.5px * var(--s)); }
.pip { width: calc(6px * var(--s)); height: calc(6px * var(--s)); background: #26262e; border: 1px solid #3a3a44; }
.pip.on { background: #ff4757; border-color: #ff8a95; box-shadow: 0 0 calc(3px * var(--s)) rgba(255,71,87,.8); }
#shieldBar { width: calc(88px * var(--s)); height: calc(4px * var(--s)); background: #12121a; border: 1px solid #26262e; }
#shieldFill { height: 100%; background: linear-gradient(90deg,#1fb9ad,#45f0e2); box-shadow: 0 0 calc(3px * var(--s)) rgba(69,240,226,.7); width: 100%; transition: width .1s; }
#wpnRow { display: flex; gap: calc(3px * var(--s)); }
.wslot { padding: calc(1px * var(--s)) calc(4px * var(--s)); border: 1px solid #26262e; background: rgba(8,8,12,.78); color: #6a6a76; font-size: calc(6px * var(--s)); }
.wslot.cur { color: #e8e8ee; border-color: var(--accent); box-shadow: 0 0 calc(3px * var(--s)) rgba(69,240,226,.35); }
#dashRow { display: flex; align-items: center; gap: calc(3px * var(--s)); color: #8b8b98; }
#dashBar { width: calc(60px * var(--s)); height: calc(3px * var(--s)); background: #12121a; border: 1px solid #26262e; }
#dashFill { height: 100%; background: #a9a9b4; width: 100%; }
#hudTC { position: absolute; top: calc(4px * var(--s)); left: calc(196px * var(--s)); width: calc(200px * var(--s)); text-align: center; }
#zoneLabel { letter-spacing: calc(1px * var(--s)); color: #c7c7d1; }
#roomLabel { color: #6a6a76; font-size: calc(6px * var(--s)); }
#toasts { position: absolute; top: calc(32px * var(--s)); left: calc(196px * var(--s)); width: calc(200px * var(--s)); max-height: calc(22px * var(--s)); overflow: hidden; text-align: center; }
.toast { display: none; color: #e8e8ee; font-size: calc(6px * var(--s)); text-shadow: 0 0 calc(4px * var(--s)) currentColor; animation: toastIn .18s ease-out; }
.toast:last-child { display: block; }
@keyframes toastIn { from { opacity: 0; transform: translateY(calc(-4px * var(--s))); } }
#hudTR { position: absolute; top: calc(4px * var(--s)); right: calc(4px * var(--s)); text-align: right; }
#score { color: #8b8b98; letter-spacing: calc(0.5px * var(--s)); }
#combo { color: var(--amber); font-weight: bold; text-shadow: 0 0 calc(4px * var(--s)) rgba(255,184,77,.9);
  transition: transform .06s; }
#combo.hot { color: #fff; text-shadow: 0 0 calc(6px * var(--s)) var(--amber); }
#combo.pop { transform: scale(1.35); }
#hudFooter { position: absolute; left: 0; right: 0; top: calc((272px + var(--hud-top)) * var(--s)); height: calc(var(--hud-bottom) * var(--s)); border-top: 1px solid #26262e; }
#hudBL { position: absolute; top: calc(4px * var(--s)); left: calc(4px * var(--s));
  display: flex; flex-wrap: wrap; align-content: flex-start; width: calc(104px * var(--s)); max-height: calc(68px * var(--s)); overflow-y: auto; pointer-events: auto; }
#floorMap { position: absolute; inset: auto; right: calc(4px * var(--s)); top: calc(4px * var(--s)); width: calc(100px * var(--s)); height: calc(66px * var(--s)); background: transparent; }
#objective { position: absolute; left: calc(112px * var(--s)); top: calc(30px * var(--s)); width: calc(256px * var(--s)); text-align: center; color: #a9a9b4; }
.chipTag { display: inline-block; margin: calc(1px * var(--s)) calc(2px * var(--s)) 0 0;
  padding: 0 calc(3px * var(--s)); border: 1px solid #3a3a44; color: #a9a9b4; font-size: calc(6px * var(--s)); }
.chipTag.r2 { border-color: var(--accent); color: var(--accent); }
.chipTag.r3 { border-color: var(--amber); color: var(--amber); }
.synTag { color: var(--amber); border-color: var(--amber); text-shadow: 0 0 calc(3px * var(--s)) rgba(255,184,77,.6); }
/* ---------- Boss 条 ---------- */
#bossBar { position: absolute; top: calc(30px * var(--s)); left: calc(112px * var(--s));
  width: calc(256px * var(--s)); display: none; z-index: 30; pointer-events: none; }
#bossBar.show { display: block; }
#bossName { text-align: center; color: #ff8a95; letter-spacing: calc(1.5px * var(--s));
  text-shadow: 0 0 calc(5px * var(--s)) rgba(255,71,87,.8); margin-bottom: calc(2px * var(--s)); font-size: calc(7px * var(--s)); }
#bossTrack { position: relative; height: calc(6px * var(--s)); background: #12121a; border: 1px solid #3a3a44; }
#bossGhost { position: absolute; inset: 0; background: rgba(232,232,238,.55); width: 100%; }
#bossFill { position: absolute; inset: 0; background: linear-gradient(90deg,#c22433,#ff4757); width: 100%;
  box-shadow: 0 0 calc(4px * var(--s)) rgba(255,71,87,.7); }
#bossPhases { display: flex; gap: calc(2px * var(--s)); margin-top: calc(2px * var(--s)); justify-content: center; }
.bphase { width: calc(26px * var(--s)); height: calc(3px * var(--s)); background: #1a1a20; border: 1px solid #26262e; }
.bphase.cur { background: var(--amber); box-shadow: 0 0 calc(3px * var(--s)) var(--amber); }
#prompt { position: absolute; top: calc(4px * var(--s)); left: calc(112px * var(--s)); width: calc(256px * var(--s)); text-align: center;
  color: #e8e8ee; background: rgba(8,8,12,.85); border: 1px solid #3a3a44;
  padding: calc(2px * var(--s)) calc(6px * var(--s)); display: none; z-index: 31; pointer-events: none; }
/* ---------- 横幅 ---------- */
#banner { position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%);
  text-align: center; z-index: 32; pointer-events: none; opacity: 0; transition: opacity .15s; }
#banner.show { opacity: 1; }
#bannerText { font-size: calc(13px * var(--s)); font-weight: bold; letter-spacing: calc(2px * var(--s));
  text-shadow: 0 0 calc(10px * var(--s)) currentColor; }
#bannerSub { font-size: calc(6px * var(--s)); color: #8b8b98; letter-spacing: calc(2px * var(--s)); margin-top: calc(2px * var(--s)); }
/* ---------- 晶片选择 ---------- */
#chipOverlay { position: absolute; inset: 0; z-index: 50; display: none;
  background: rgba(5,5,8,.82); align-items: center; justify-content: center; flex-direction: column; gap: calc(8px * var(--s)); }
#chipOverlay.show { display: flex; }
#chipTitle { font-size: calc(11px * var(--s)); letter-spacing: calc(2px * var(--s)); color: var(--accent);
  text-shadow: 0 0 calc(8px * var(--s)) rgba(69,240,226,.7); }
#chipTitleSub { font-size: calc(6px * var(--s)); color: #6a6a76; letter-spacing: calc(1.5px * var(--s)); }
#chipCards { display: flex; gap: calc(8px * var(--s)); }
.chipCard { width: calc(96px * var(--s)); padding: calc(7px * var(--s)); cursor: pointer; pointer-events: auto;
  background: rgba(12,12,18,.95); border: 1px solid #3a3a44; transition: transform .08s, box-shadow .08s, border-color .08s; }
.chipCard:hover { transform: translateY(calc(-3px * var(--s))); }
.chipCard.r1 { border-color: #6a6a76; } .chipCard.r1:hover { box-shadow: 0 0 calc(8px * var(--s)) rgba(170,170,180,.4); }
.chipCard.r2 { border-color: var(--accent); } .chipCard.r2:hover { box-shadow: 0 0 calc(10px * var(--s)) rgba(69,240,226,.55); }
.chipCard.r3 { border-color: var(--amber); } .chipCard.r3:hover { box-shadow: 0 0 calc(10px * var(--s)) rgba(255,184,77,.55); }
.ccRarity { font-size: calc(5px * var(--s)); letter-spacing: calc(1px * var(--s)); color: #6a6a76; }
.r2 .ccRarity { color: var(--accent); } .r3 .ccRarity { color: var(--amber); }
.ccName { font-size: calc(9px * var(--s)); font-weight: bold; margin: calc(2px * var(--s)) 0; }
.ccDesc { font-size: calc(6px * var(--s)); color: #a9a9b4; min-height: calc(20px * var(--s)); }
.ccSyn { font-size: calc(6px * var(--s)); color: var(--amber); margin-top: calc(2px * var(--s)); }
.ccSyn::before { content: "◆ "; }
.ccUp { font-size: calc(6px * var(--s)); color: var(--amber); margin-top: calc(1px * var(--s)); }
.ccUp::before { content: "▲ "; }
#coins { color: var(--amber); font-size: calc(6px * var(--s)); }
#heroRow { display: flex; gap: calc(6px * var(--s)); margin-top: calc(4px * var(--s)); }
.artIcon { position: static; display: block; width: calc(24px * var(--s)); height: calc(24px * var(--s));
  margin: 0 auto calc(3px * var(--s)); background: transparent; cursor: inherit; pointer-events: none; }
.heroCard .artIcon { float: left; margin: 0 calc(4px * var(--s)) 0 0; }
.wslot .artIcon { display: inline-block; width: calc(12px * var(--s)); height: calc(8px * var(--s));
  margin: 0 calc(2px * var(--s)) 0 0; vertical-align: middle; }
.heroCard { width: calc(104px * var(--s)); padding: calc(5px * var(--s)); cursor: pointer; pointer-events: auto;
  background: rgba(12,12,18,.95); border: 1px solid #3a3a44; transition: all .08s; }
.heroCard:hover { border-color: #8b8b98; }
.heroCard.sel { border-color: var(--accent); box-shadow: 0 0 calc(8px * var(--s)) rgba(69,240,226,.45); }
.heroCard .hName { font-size: calc(8px * var(--s)); font-weight: bold; }
.heroCard .hDesc { font-size: calc(6px * var(--s)); color: #a9a9b4; margin-top: calc(2px * var(--s)); }
#records { font-size: calc(6px * var(--s)); color: #8b8b98; letter-spacing: calc(1px * var(--s)); margin-top: calc(4px * var(--s)); }
#dailyPanel { box-sizing: border-box; width: calc(324px * var(--s)); margin-top: calc(6px * var(--s));
  padding: calc(4px * var(--s)) calc(8px * var(--s)); text-align: left;
  border: 1px solid rgba(255,184,77,.45); background: rgba(255,184,77,.05); }
#dailyHead { font-size: calc(7px * var(--s)); font-weight: bold; color: var(--amber); letter-spacing: calc(1px * var(--s)); }
#dailyMods { font-size: calc(6px * var(--s)); color: #a9a9b4; margin-top: calc(2px * var(--s)); }
.dailyMod b { color: var(--amber); margin-right: calc(3px * var(--s)); }
#dailyBest { font-size: calc(6px * var(--s)); color: #8b8b98; margin-top: calc(2px * var(--s)); }
.btn.amber { border-color: rgba(255,184,77,.6); color: var(--amber); }
.btn.amber:hover { box-shadow: 0 0 calc(8px * var(--s)) rgba(255,184,77,.45); }
#chipSlotPanel { box-sizing: border-box; width: calc(324px * var(--s)); margin-top: calc(4px * var(--s));
  padding: calc(4px * var(--s)) calc(8px * var(--s)); text-align: left;
  border: 1px solid #3a3a44; background: rgba(69,240,226,.04); }
#chipSlotLabel { font-size: calc(6px * var(--s)); color: var(--accent); letter-spacing: calc(1px * var(--s)); }
#chipSlot { display: flex; flex-wrap: wrap; gap: calc(2px * var(--s)); margin-top: calc(3px * var(--s)); }
#chipSlot .chipTag { cursor: pointer; pointer-events: auto; opacity: .55; }
#chipSlot .chipTag:hover { opacity: .9; }
#chipSlot .chipTag.sel { opacity: 1; box-shadow: 0 0 calc(5px * var(--s)) rgba(69,240,226,.6); }
#chipSlotPanel .lockedSlot { display: none; }
.heroCard.locked { opacity: .45; filter: grayscale(1); cursor: not-allowed; }
.heroCard.locked:hover { transform: none; box-shadow: none; border-color: #3a3a44; }
.lockedTag { color: #8b8b98; }
#shopOverlay { position: absolute; inset: 0; z-index: 50; display: none;
  background: rgba(5,5,8,.86); align-items: center; justify-content: center; flex-direction: column; gap: calc(6px * var(--s)); }
#shopOverlay.show { display: flex; }
#shopTitle { font-size: calc(11px * var(--s)); letter-spacing: calc(2px * var(--s)); color: var(--amber);
  text-shadow: 0 0 calc(8px * var(--s)) rgba(255,184,77,.7); }
#shopTitleSub { font-size: calc(6px * var(--s)); color: #6a6a76; letter-spacing: calc(1.5px * var(--s)); }
#shopCards { display: flex; gap: calc(8px * var(--s)); }
.shopCard { width: calc(96px * var(--s)); padding: calc(6px * var(--s)); cursor: pointer; pointer-events: auto;
  background: rgba(12,12,18,.95); border: 1px solid #3a3a44; transition: transform .08s, box-shadow .08s; }
.shopCard:hover { transform: translateY(calc(-3px * var(--s))); }
.shopCard.sold { opacity: .35; cursor: default; }
.shopCard.sold:hover { transform: none; }
.shopCard .sName { font-size: calc(8px * var(--s)); font-weight: bold; }
.shopCard .sDesc { font-size: calc(6px * var(--s)); color: #a9a9b4; min-height: calc(18px * var(--s)); margin: calc(2px * var(--s)) 0; }
.shopCard .sPrice { font-size: calc(7px * var(--s)); color: var(--amber); }

/* ---------- 全屏界面 ---------- */
.screen { position: absolute; inset: 0; z-index: 60; display: none;
  align-items: center; justify-content: center; flex-direction: column; gap: calc(8px * var(--s));
  background: rgba(5,5,8,.88); }
.screen.show { display: flex; }
.bigLogo { font-size: calc(26px * var(--s)); font-weight: bold; letter-spacing: calc(6px * var(--s));
  color: #f2f2f6; text-shadow: calc(2px * var(--s)) calc(2px * var(--s)) 0 #1a1a20, 0 0 calc(18px * var(--s)) rgba(69,240,226,.5); }
.subLogo { font-size: calc(8px * var(--s)); color: var(--accent); letter-spacing: calc(4px * var(--s)); }
.btn { pointer-events: auto; cursor: pointer; background: rgba(12,12,18,.9); border: 1px solid #3a3a44;
  color: #e8e8ee; padding: calc(4px * var(--s)) calc(14px * var(--s)); font-size: calc(8px * var(--s));
  letter-spacing: calc(1.5px * var(--s)); transition: all .08s; font-family: inherit; }
.btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 calc(8px * var(--s)) rgba(69,240,226,.4); }
.btn.primary { border-color: var(--accent); color: var(--accent); }
#endTitle { font-size: calc(22px * var(--s)); font-weight: bold; letter-spacing: calc(4px * var(--s)); }
#endTitle.win { color: #ffb84d; text-shadow: 0 0 calc(16px * var(--s)) rgba(255,184,77,.8); }
#endTitle.lose { color: #ff4757; text-shadow: 0 0 calc(16px * var(--s)) rgba(255,71,87,.7); }
#endEn { font-size: calc(10px * var(--s)); color: #6a6a76; letter-spacing: calc(6px * var(--s)); }
#endStats { display: grid; grid-template-columns: auto auto; gap: calc(2px * var(--s)) calc(14px * var(--s));
  font-size: calc(7px * var(--s)); color: #a9a9b4; }
#endStats b { color: #f2f2f6; font-weight: normal; }
#endChips { font-size: calc(6px * var(--s)); color: #8b8b98; max-width: calc(300px * var(--s)); text-align: center; }
#endRating { font-size: calc(20px * var(--s)); color: var(--amber); text-shadow: 0 0 calc(12px * var(--s)) rgba(255,184,77,.9); }
#helpBox { font-size: calc(7px * var(--s)); color: #a9a9b4; line-height: 1.9; }
#helpBox b { color: var(--accent); font-weight: normal; display: inline-block; min-width: calc(70px * var(--s)); }
#pauseHint { font-size: calc(9px * var(--s)); color: #8b8b98; letter-spacing: calc(3px * var(--s)); }
#fps { position: absolute; top: calc(4px * var(--s)); left: 50%; transform: translateX(-50%) translateY(calc(14px * var(--s)));
  color: #45f0e2; font-size: calc(6px * var(--s)); z-index: 45; display: none; pointer-events: none; }

/* ---------- 触控层(仅触屏设备显示;容器不拦截指针,只有控件本身捕获) ---------- */
#touchUI { position: fixed; inset: 0; z-index: 70; display: none; pointer-events: none; --ts: min(var(--s), 2); }
#touchUI.show { display: block; }
.tbtn { position: absolute; pointer-events: auto; touch-action: none;
  display: flex; align-items: center; justify-content: center;
  background: rgba(8,8,12,.78); border: 1px solid #3a3a44; color: #a9a9b4;
  font-size: calc(7px * var(--ts)); letter-spacing: calc(1px * var(--ts)); }
.tbtn.press { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 calc(6px * var(--ts)) rgba(69,240,226,.5); }
#stickBase { position: absolute; left: calc(10px * var(--ts)); bottom: calc(10px * var(--ts));
  width: calc(68px * var(--ts)); height: calc(68px * var(--ts)); border-radius: 50%;
  pointer-events: auto; touch-action: none; background: rgba(8,8,12,.55); border: 1px solid #3a3a44; }
#stickKnob { position: absolute; left: 50%; top: 50%; width: calc(28px * var(--ts)); height: calc(28px * var(--ts));
  border-radius: 50%; transform: translate(-50%,-50%); background: rgba(69,240,226,.2); border: 1px solid var(--accent); }
#btnFire { right: calc(10px * var(--ts)); bottom: calc(10px * var(--ts));
  width: calc(60px * var(--ts)); height: calc(60px * var(--ts)); border-radius: 50%;
  color: #ff8a95; border-color: #6a3038; }
#btnDash { right: calc(78px * var(--ts)); bottom: calc(10px * var(--ts)); width: calc(44px * var(--ts)); height: calc(44px * var(--ts)); }
#btnMelee { right: calc(10px * var(--ts)); bottom: calc(78px * var(--ts)); width: calc(44px * var(--ts)); height: calc(44px * var(--ts)); }
#btnInteract { right: calc(78px * var(--ts)); bottom: calc(78px * var(--ts)); width: calc(44px * var(--ts)); height: calc(44px * var(--ts)); }
#btnPause { right: calc(4px * var(--ts)); top: calc(30px * var(--ts)); width: calc(22px * var(--ts)); height: calc(22px * var(--ts));
  font-size: calc(6px * var(--ts)); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="272"></canvas>

  <div id="hud">
    <div id="hudTL">
      <div id="hpPips" class="panel"></div>
      <div id="shieldBar"><div id="shieldFill"></div></div>
      <div id="wpnRow"></div>
      <div id="dashRow"><span>冲刺</span><div id="dashBar"><div id="dashFill"></div></div></div>
    </div>
    <div id="hudTC">
      <div id="zoneLabel">待命</div>
      <div id="roomLabel"></div>
    </div>
    <div id="hudTR">
      <div id="score">得分 0</div>
      <div id="coins">金币 0</div>
      <div id="combo"></div>
    </div>
    <div id="toasts" role="status" aria-live="polite"></div>
    <div id="hudFooter">
      <div id="hudBL"></div>
      <canvas id="floorMap" width="100" height="66" aria-label="楼层房间地图"></canvas>
      <div id="objective"></div>
      <div id="bossBar">
    <div id="bossName">零号 · 处刑者</div>
    <div id="bossTrack"><div id="bossGhost"></div><div id="bossFill"></div></div>
    <div id="bossPhases"><div class="bphase"></div><div class="bphase"></div><div class="bphase"></div></div>
      </div>
      <div id="prompt"></div>
    </div>
  </div>
  <div id="banner"><div id="bannerText"></div><div id="bannerSub"></div></div>
  <div id="fps"></div>

  <div id="chipOverlay">
    <div id="chipTitle">战 术 晶 片</div>
    <div id="chipTitleSub">SELECT · 选择一枚装入协议核心</div>
    <div id="chipCards"></div>
  </div>

  <div id="shopOverlay">
    <div id="shopTitle">补 给 站</div>
    <div id="shopTitleSub">SUPPLY · 金币采购（区域间补给）</div>
    <div id="shopCards"></div>
    <button class="btn" id="btnShopLeave">离开补给站</button>
  </div>

  <div id="screenTitle" class="screen show">
    <div class="bigLogo">零号协议</div>
    <div class="subLogo">ZERO PROTOCOL</div>
    <div style="color:#6a6a76; font-size:calc(6px*var(--s)); letter-spacing:calc(1px*var(--s));">黑白灰废土 · 高强度肉鸽弹幕射击</div>
    <div id="heroRow"></div>
    <div style="font-size:calc(7px*var(--s));margin:calc(4px*var(--s));">
      <label for="difficultySelect">难度</label>
      <select id="difficultySelect" style="font:inherit;background:#182430;color:#e8e8ee;border:1px solid #345064;padding:calc(3px*var(--s));">
        <option value="challenge">挑战</option><option value="standard" selected>标准（推荐）</option><option value="casual">休闲</option>
      </select>
      <span id="difficultyDescription"></span>
    </div>
    <div id="dailyPanel">
      <div id="dailyHead">每日挑战 · <span id="dailyDate"></span></div>
      <div id="dailyMods"></div>
      <div id="dailyBest"></div>
    </div>
    <div id="chipSlotPanel">
      <div id="chipSlotLabel">初始晶片槽</div>
      <div id="chipSlot"></div>
    </div>
    <div id="records"></div>
    <div style="display:flex; gap:calc(6px*var(--s)); margin-top:calc(6px*var(--s));">
      <button class="btn primary" id="btnStart">开始游戏</button>
      <button class="btn amber" id="btnDaily">每日挑战</button>
      <button class="btn" id="btnBot">AI 代打演示</button>
      <button class="btn" id="btnHelp">操作说明</button>
    </div>
    <div id="helpBox" style="display:none; margin-top:calc(4px*var(--s));">
      <div><b>WASD / 方向键</b> 移动　<b style="min-width:auto">鼠标</b> 瞄准 · 左键射击</div>
      <div><b>Shift / 右键</b> 相位冲刺（无敌帧）　<b style="min-width:auto">F</b> 相位刃格挡斩（弹反弹幕）</div>
      <div><b>E</b> 进出房门 / 拾取武器 / 进入传送门　<b style="min-width:auto">Q / 1 / 2</b> 切换武器</div>
      <div><b>B</b> AI 代打　<b style="min-width:auto">M</b> 静音　<b style="min-width:auto">P</b> 暂停</div>
    </div>
  </div>

  <div id="screenEnd" class="screen">
    <div id="endTitle"></div>
    <div id="endEn"></div>
    <div id="endRating"></div>
    <div id="endStats"></div>
    <div id="endChips"></div>
    <div style="display:flex; gap:calc(6px*var(--s)); margin-top:calc(4px*var(--s));">
      <button class="btn primary" id="btnRetry">再来一局</button>
    </div>
  </div>

  <div id="screenPause" class="screen">
    <div style="font-size:calc(14px*var(--s)); letter-spacing:calc(4px*var(--s));">已暂停</div>
    <div id="pauseHint">按 P 继续</div>
  </div>

  <div id="vig"></div>
  <div id="fxLow"></div>
  <div id="fxHurt"></div>
  <div id="scan"></div>
</div>

<!-- 触控层:仅触屏设备在对局中显示(input.js 控制 .show),容器 pointer-events:none -->
<div id="touchUI">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div class="tbtn" id="btnFire">射击</div>
  <div class="tbtn" id="btnDash">冲刺</div>
  <div class="tbtn" id="btnMelee">相位刃</div>
  <div class="tbtn" id="btnInteract">互动</div>
  <div class="tbtn" id="btnPause">II</div>
</div>
